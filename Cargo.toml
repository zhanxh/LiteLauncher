[workspace]
resolver = "2"
members = [
    "src-tauri",
    "src-tauri/crates/ll-plugin-api",
    "src-tauri/crates/ll-plugin-abi",
    "src-tauri/crates/ll-host",
    "src-tauri/crates/ll-native-shell",
]

exclude = [
    "plugins/apps/be",
    "plugins/todo/be",
    "plugins/ai/be",
    "plugins/notes/be",
    "plugins/pomo/be",
]

# 插件不再编进主程序（M5 全量剥离）：plugins/*/be 由各自 plugins/*/native 工程以 path 依赖引用；
# exclude 保证它们不属于本 workspace、但 `cd plugins/<id>/be && cargo test` 仍可独立运行（否则单测被静默跳过）。

# 依赖规则（CI/grep 门禁）：
# 1. plugins/*/be 只允许依赖 ll-plugin-api 与通用基础库（serde/chrono/uuid/dirs），
#    禁止依赖 ll-host、tauri 或彼此——保证插件可独立编译、独立演进。
# 2. ll-host 不得依赖任何具体插件（注册方向：应用 crate → 插件 crate）。

# ── 构建档位（日常 vs 正式发布）────────────────────────────────
# 日常：`build.cmd` / `cargo build --release`，直接吃本段设置。
# 正式：`build.cmd ship`，由脚本用 CARGO_PROFILE_RELEASE_* 环境变量把
#       本段临时覆盖成最优化档（fat LTO + 单 CGU）。
#
# 为什么默认档不再是 codegen-units=1 + lto=true：
# 那组设置只影响最后两个编译单元（ll-host 与 tauri-app），却占了整场构建的
# 绝大部分时间——fat LTO 要在链接期把上游所有 rlib 的 LLVM IR 合并重优化
# （无法并行），codegen-units=1 又取消了 crate 内的并行编译。每次微调宿主
# 都要等十几分钟，等于没有反馈回路。
# thin LTO + 4 CGU 的包体/性能损失通常在个位数百分比内，而正式包走 ship
# 档重编一次即可拿回全部优化，两边都不吃亏。
#
# 发布优化配置必须声明在 workspace 根（成员包内的 profile 会被忽略）
[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
