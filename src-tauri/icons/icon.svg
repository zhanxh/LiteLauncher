<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- LiteLauncher 应用图标：深色圆角底 + 搜索条 + 闪电（轻快启动） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242935"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cabff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- 内缘微高光 -->
  <rect x="10" y="10" width="1004" height="1004" rx="214" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="4"/>

  <!-- 搜索条（产品核心交互的隐喻） -->
  <rect x="92" y="372" width="840" height="280" rx="140" fill="#262b36" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- 闪电：光晕 + 主体（略溢出搜索条，动势） -->
  <path d="M592 90 L232 608 h204 L352 940 L808 406 h-228 L842 90 Z" fill="#3b82f6" opacity="0.55" filter="url(#glow)"/>
  <path d="M592 90 L232 608 h204 L352 940 L808 406 h-228 L842 90 Z" fill="url(#bolt)"/>
</svg>
