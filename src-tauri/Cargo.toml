[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# 本包是仓库根 workspace 的成员（见 ../Cargo.toml），插件为独立 crate：
#   plugins/{todo,apps,notes}/be —— 仅依赖 ll-plugin-api，可独立编译

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 编译产物直接命名为 LiteLauncher（替代默认的包名 tauri-app）
[[bin]]
name = "LiteLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ll-plugin-api = { path = "crates/ll-plugin-api" }
ll-host = { path = "crates/ll-host" }
ll-plugin-todo = { path = "../plugins/todo/be" }
ll-plugin-apps = { path = "../plugins/apps/be" }
ll-plugin-notes = { path = "../plugins/notes/be" }
ll-plugin-ai = { path = "../plugins/ai/be" }
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
