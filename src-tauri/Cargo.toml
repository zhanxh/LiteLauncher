[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# 本包是仓库根 workspace 的成员（见 ../Cargo.toml）。
# M5 起主程序**不链接任何插件**：todo/apps/ai/notes 全部以 native dll 加载，
# 内置插件仅剩宿主核心服务（Tauri 窗口、SQLite 注册表、svc 分发器）。

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 编译产物直接命名为 LiteLauncher（替代默认的包名 tauri-app）
[[bin]]
name = "LiteLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ll-plugin-api = { path = "crates/ll-plugin-api" }
ll-host = { path = "crates/ll-host" }
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
