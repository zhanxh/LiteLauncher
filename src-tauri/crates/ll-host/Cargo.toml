[package]
name = "ll-host"
version = "0.1.0"
edition = "2024"
description = "LiteLauncher 插件宿主：注册表、统一 IPC 通道、门控服务实现"

[dependencies]
ll-plugin-api = { path = "../ll-plugin-api" }
tauri = { version = "2" }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
