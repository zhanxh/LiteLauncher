[package]
name = "ll-plugin-ai-native"
version = "0.1.0"
edition = "2024"
description = "LiteLauncher ai 插件的 native 动态库薄壳（M5 全量剥离）：复用 be 的全部业务逻辑，经 ll-native-shell 反向适配宿主 svc 通道"

# 脱离宿主 workspace：native 插件自管 profile（panic=unwind，宿主是 abort）
[workspace]

[lib]
name = "ai"
crate-type = ["cdylib"]

[dependencies]
ll-plugin-abi = { path = "../../../src-tauri/crates/ll-plugin-abi" }
ll-plugin-api = { path = "../../../src-tauri/crates/ll-plugin-api" }
ll-native-shell = { path = "../../../src-tauri/crates/ll-native-shell" }
# 业务逻辑本体（与 builtin 时代同一份代码，零改动复用）
ll-plugin-ai = { path = "../be" }
serde_json = "1"

[profile.release]
panic = "unwind"
strip = true
