[package]
name = "ll-plugin-apps"
version = "0.1.0"
edition = "2024"
description = "LiteLauncher 应用启动插件：/app 指令后端（快捷方式管理 + 系统应用扫描 + 受控启动）"

[dependencies]
ll-plugin-api = { path = "../../../src-tauri/crates/ll-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
# 纯文本库、零传递依赖：只用于把应用名转成检索用拼音，不触碰平台 API
pinyin = "0.10"

[dev-dependencies]
# 仅测试用：用内存 SQLite 验证导入的 upsert / 去重 / 隐藏语义
rusqlite = { version = "0.31", features = ["bundled"] }
