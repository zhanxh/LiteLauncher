[package]
name = "ll-plugin-pomo-native"
version = "0.4.0"
edition = "2024"
description = "LiteLauncher pomo 插件的 native 动态库薄壳（M5）：复用 be 的分段计时状态机，经 ll-native-shell 反向适配宿主 svc 通道"

# 脱离宿主 workspace：native 插件自管 profile（panic=unwind，宿主是 abort）
[workspace]

[lib]
name = "pomo"
crate-type = ["cdylib"]

[dependencies]
ll-plugin-abi = { path = "../../../src-tauri/crates/ll-plugin-abi" }
ll-plugin-api = { path = "../../../src-tauri/crates/ll-plugin-api" }
ll-native-shell = { path = "../../../src-tauri/crates/ll-native-shell" }
# 业务逻辑本体（从 pomo.py 重写的 Rust 版）
ll-plugin-pomo = { path = "../be" }
serde_json = "1"

[profile.release]
panic = "unwind"
strip = true
