[package]
name = "ll-plugin-sysinfo-native"
version = "0.2.0"
edition = "2024"
description = "LiteLauncher /sysinfo 插件的 native 动态库薄壳（M6）：业务在 be/ crate，经 ll-native-shell 走宿主 svc 通道"

# 脱离宿主 workspace：native 插件自管 profile（panic=unwind，宿主是 abort）
[workspace]

[lib]
name = "sysinfo"
crate-type = ["cdylib"]

[dependencies]
ll-plugin-abi = { path = "../../../src-tauri/crates/ll-plugin-abi" }
ll-plugin-api = { path = "../../../src-tauri/crates/ll-plugin-api" }
ll-native-shell = { path = "../../../src-tauri/crates/ll-native-shell" }
# 业务逻辑本体（从 sysinfo.py 重写的 Rust 版）
ll-plugin-sysinfo = { path = "../be" }
serde_json = "1"

[profile.release]
panic = "unwind"
strip = true
