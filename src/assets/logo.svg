<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- LiteLauncher 应用图标：深色圆角底 + 放大镜（搜索）+ 镜内闪电（轻快启动）
       小尺寸守则：一个图元（放大镜含闪电）、粗轮廓、高对比——
       搜索条与闪电分开画的历史版本在 16-32px 下搜索条不可见（深底上画深色 + 10% 描边） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242935"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cabff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8cce6"/>
      <stop offset="1" stop-color="#8fadd4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- 内缘微高光 -->
  <rect x="10" y="10" width="1004" height="1004" rx="214" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="4"/>

  <!-- 放大镜：环 + 柄（搜索的隐喻，任意尺寸可读） -->
  <circle cx="448" cy="448" r="252" fill="none" stroke="url(#lens)" stroke-width="86"/>
  <line x1="646" y1="646" x2="836" y2="836" stroke="url(#lens)" stroke-width="86" stroke-linecap="round"/>

  <!-- 镜内闪电：光晕 + 主体（轻快启动的身份） -->
  <g transform="translate(268,290) scale(0.335)">
    <path d="M592 90 L232 608 h204 L352 940 L808 406 h-228 L842 90 Z" fill="#3b82f6" opacity="0.5" filter="url(#glow)"/>
    <path d="M592 90 L232 608 h204 L352 940 L808 406 h-228 L842 90 Z" fill="url(#bolt)"/>
  </g>
</svg>
