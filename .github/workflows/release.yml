name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # ship 构建的根 workspace 被 build.cmd 钉到 src-tauri/target-ship；
      # native 插件是独立 cargo 工程，各自缓存在 plugins/<id>/native/target。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> src-tauri/target-ship
            plugins/ai/native -> target
            plugins/apps/native -> target
            plugins/echo/native -> target
            plugins/find/native -> target
            plugins/notes/native -> target
            plugins/pomo/native -> target
            plugins/sysinfo/native -> target
            plugins/todo/native -> target

      - run: npm ci
      - run: npm run version:check

      - name: 校验 tag 与 package 版本一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tag -ne $pkg) {
            throw "tag ${{ github.ref_name }} 与 package.json $pkg 不一致"
          }
          Write-Host "release version=$pkg"

      - name: 配置更新源（owner/repo/pubkey）
        shell: pwsh
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
        run: |
          if (-not $env:TAURI_UPDATER_PUBKEY) {
            throw "缺少仓库 Variable TAURI_UPDATER_PUBKEY（tauri signer generate 的公钥）"
          }
          node tools/release-config.mjs --owner $env:RELEASE_OWNER --repo $env:RELEASE_REPO

      - name: 预检更新签名私钥
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $raw = $env:TAURI_SIGNING_PRIVATE_KEY
            if (-not $raw) {
              throw "缺少 Secret TAURI_SIGNING_PRIVATE_KEY（配置在 $env:GITHUB_REPOSITORY 的 Repository secrets，名称需完全一致）"
            }
            $hasPassword = [bool]$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD

            # 私钥既可能是文件路径（本地用），也可能是 base64 内容（CI 用）。
            # 内容串可能长于 MAX_PATH，直接 Test-Path 会抛错，这里先限长并吞掉探测异常。
            $keyPath = $null
            $trimmed = $raw.Trim()
            if ($trimmed.Length -lt 260) {
              try {
                if (Test-Path -LiteralPath $trimmed) { $keyPath = $trimmed }
              } catch { $keyPath = $null }
            }

            if (-not $keyPath) {
              # GitHub secret 常见问题：从文件粘贴时带换行，Tauri 的 base64 解码不容忍空白
              $key = $raw -replace '\s', ''
              try {
                $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
              } catch {
                throw "TAURI_SIGNING_PRIVATE_KEY 既不是存在的文件路径，也不是合法 base64（trim 后 $($key.Length) 字符）。应填 tauri signer generate 生成的 .key 文件内容（单行 base64），不要填路径或解码后的文本"
              }
              if ($decoded -notmatch 'rsign encrypted secret key') {
                $firstLine = ($decoded -split "`r?`n")[0]
                throw "TAURI_SIGNING_PRIVATE_KEY 解码后不是 minisign 私钥（首行：'$firstLine'），可能误填了公钥或其他内容"
              }
              $keyPath = Join-Path $env:RUNNER_TEMP 'updater.key'
              [IO.File]::WriteAllText($keyPath, $key)
              Write-Host "私钥内容已规范化写入 runner 临时文件（$($key.Length) 字符）"
            }

            # 后续构建步骤统一从文件读取，避免超长/多行 secret 直接进环境变量
            "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            # 试签一次，提前暴露密码错误或私钥损坏（否则要等 10 分钟编译完才失败）
            $probe = Join-Path $env:RUNNER_TEMP 'sign-probe.txt'
            Set-Content -LiteralPath $probe -Value 'tauri updater key preflight' -NoNewline
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            npx tauri signer sign --private-key-path $keyPath $probe
            if ($LASTEXITCODE -ne 0) {
              throw "私钥签名自检失败（exit $LASTEXITCODE，password 已配置=$hasPassword）：确认 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 与私钥匹配"
            }
            if (-not (Test-Path -LiteralPath "$probe.sig")) {
              throw "私钥签名自检没有生成 $probe.sig"
            }

            # Tauri 对私钥/pubkey 不匹配只打 warning，产物能发布但客户端永远验签失败；
            # 发布流水线必须在构建前把它变成致命错误。签名 box 与 pubkey 的 keynum 均为
            # 2 字节算法 + 8 字节 key id，直接比较这一段。
            # Linux job 不重复这段：两个 job 用的是同一对 secret/variable，这里失败就没人发布。
            function Get-KeyIdHex([byte[]]$blob) {
              return (($blob[2..9]) | ForEach-Object { $_.ToString('X2') }) -join ''
            }
            $conf = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw -Encoding UTF8 | ConvertFrom-Json
            $pub = $conf.plugins.updater.pubkey
            if (-not $pub) { throw "tauri.conf.json 缺少 plugins.updater.pubkey" }
            $sigBox = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content -Raw -LiteralPath "$probe.sig")))
            $sigId = Get-KeyIdHex ([Convert]::FromBase64String(($sigBox -split "`r?`n")[1]))
            $pubBox = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($pub))
            $pubId = Get-KeyIdHex ([Convert]::FromBase64String(($pubBox -split "`r?`n")[1]))
            if ($sigId -ne $pubId) {
              throw "签名私钥与 updater pubkey 不匹配（private=$sigId pub=$pubId）：更新包会被客户端拒签，请确认 Variable TAURI_UPDATER_PUBKEY 与 Secret TAURI_SIGNING_PRIVATE_KEY 来自同一对 tauri signer generate 密钥"
            }
            Write-Host "签名自检通过，私钥与 updater pubkey 匹配"
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            throw
          }

      - name: 构建安装包（NSIS + updater artifacts）
        shell: cmd
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: build.cmd ship

      - name: 生成 windows 更新清单片段
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          node tools/make-latest-json.mjs `
            --platform windows-x86_64 `
            --repo "${{ github.repository }}" `
            --version $version `
            --out latest-windows.json

      - name: 打包便携插件目录
        shell: pwsh
        run: Compress-Archive -Path release/plugins -DestinationPath release/plugins.zip -Force

      - name: 上传 windows 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/LiteLauncher.exe
            release/plugins.zip
            latest-windows.json
            src-tauri/target-ship/release/bundle/nsis/*.exe
            src-tauri/target-ship/release/bundle/nsis/*.sig

  linux:
    # 构建环境用 debian:bookworm 容器，而不是 runner 自带的 Ubuntu：
    # xcap → libspa-sys 0.10 要 pipewire ≥ 0.3.6x 的头文件，jammy 最高只有 0.3.48
    # （spa_meta_first / spa_meta_region_is_valid / spa_video_info_raw.flags 都编不过），
    # noble 是 pipewire 1.x 能编但把 glibc 抬到 2.39，产物连开发机（Debian 12）都跑不起来，
    # 更新链路没法自测。bookworm 同时满足 pipewire 0.3.65 与 glibc 2.36。
    # 代价：容器里没有 sudo、没有 git/xz，也没有 /dev/fuse，见下面三步。
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
    env:
      # linuxdeploy 与 appimagetool 自身是 AppImage；容器不挂 /dev/fuse，
      # 不让它们先自解压就会报 fuse 缺失，AppImage 打包整段失败。
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      # actions/checkout 要 git，setup-node 解 node 压缩包要 xz，@actions/cache 压缩要 zstd。
      # Debian 镜像不带这些，必须先于 checkout 装好，否则连仓库都拉不下来。
      - name: 容器引导
        # 这一步自己也得是 POSIX：Debian 容器里 Actions 默认用 sh -e，
        # `set -euo pipefail` 会直接报 "set: Illegal option -o pipefail"。
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git tar xz-utils zstd

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> src-tauri/target-ship
            plugins/ai/native -> target
            plugins/apps/native -> target
            plugins/echo/native -> target
            plugins/find/native -> target
            plugins/notes/native -> target
            plugins/pomo/native -> target
            plugins/sysinfo/native -> target
            plugins/todo/native -> target

      # 清单照 build.sh 的依赖预检（缺项会在那里报错并给出同一份 apt 列表）；
      # libssl-dev 给 reqwest 的 native-tls，squashfs-tools 给 appimagetool 的 mksquashfs，
      # desktop-file-utils 给 linuxdeploy 的 gtk 插件。
      - name: 安装 Linux 打包依赖
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y \
            build-essential pkg-config libclang-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgbm-dev libpipewire-0.3-dev libspa-0.2-dev \
            libfuse2 squashfs-tools desktop-file-utils

      # pipewire 太旧会在 libspa 编译期才炸（一次 CI 往返十几分钟），这里先亮版本。
      # 判据来自 jammy 0.3.48 编不过、bookworm 0.3.65 编得过。
      - name: 核对 pipewire 头文件版本
        shell: bash
        run: |
          set -euo pipefail
          v="$(pkg-config --modversion libpipewire-0.3)"
          echo "libpipewire-0.3 = $v"
          if ! dpkg --compare-versions "$v" ge 0.3.65; then
            echo "::error::pipewire 头文件过旧（$v < 0.3.65）：libspa-sys 会缺 spa_meta_first / spa_video_info_raw.flags 等符号，编译必失败"
            exit 1
          fi

      - run: npm ci
      - run: npm run version:check

      - name: 校验 tag 与 package 版本一致
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$tag" != "$pkg" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json $pkg 不一致"
            exit 1
          fi
          echo "release version=$pkg"

      - name: 配置更新源（owner/repo/pubkey）
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_UPDATER_PUBKEY:-}" ]]; then
            echo "::error::缺少仓库 Variable TAURI_UPDATER_PUBKEY（tauri signer generate 的公钥）"
            exit 1
          fi
          node tools/release-config.mjs --owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}"

      # 与 windows job 的预检同源，只是 bash：先规范化 secret 再试签，
      # 免得编译十分钟之后才暴露密码错或私钥被截断。
      - name: 预检更新签名私钥
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::缺少 Secret TAURI_SIGNING_PRIVATE_KEY（配置在 $GITHUB_REPOSITORY 的 Repository secrets，名称需完全一致）"
            exit 1
          fi
          key="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')"
          if ! decoded="$(printf '%s' "$key" | base64 -d 2>&1)"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 不是合法 base64（trim 后 ${#key} 字符）。应填 tauri signer generate 生成的 .key 文件内容（单行 base64），不要填路径或解码后的文本"
            exit 1
          fi
          if ! grep -q 'rsign encrypted secret key' <<<"$decoded"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 解码后不是 minisign 私钥（首行：'$(head -1 <<<"$decoded")'），可能误填了公钥或其他内容"
            exit 1
          fi
          key_path="$RUNNER_TEMP/updater.key"
          printf '%s' "$key" > "$key_path"
          # 后续步骤统一从文件读取，避免超长 secret 一直挂在环境变量里
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
          probe="$RUNNER_TEMP/sign-probe.txt"
          printf '%s' 'tauri updater key preflight' > "$probe"
          unset TAURI_SIGNING_PRIVATE_KEY
          if ! npx tauri signer sign --private-key-path "$key_path" "$probe"; then
            echo "::error::私钥签名自检失败（password 已配置=$([[ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]] && echo yes || echo no)）：确认 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 与私钥匹配"
            exit 1
          fi
          [[ -f "$probe.sig" ]] || { echo "::error::私钥签名自检没有生成 $probe.sig"; exit 1; }
          echo "签名自检通过"

      - name: 构建安装包（deb + AppImage updater 载体）
        shell: bash
        env:
          SHIP_BUNDLES: deb,appimage
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build.sh ship

      - name: 生成 linux 更新清单片段
        shell: bash
        run: |
          node tools/make-latest-json.mjs \
            --platform linux-x86_64 \
            --repo "${{ github.repository }}" \
            --version "${GITHUB_REF_NAME#v}" \
            --out latest-linux.json

      - name: 上传 linux 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            latest-linux.json
            src-tauri/target-ship/release/bundle/deb/*.deb
            src-tauri/target-ship/release/bundle/appimage/*.AppImage
            src-tauri/target-ship/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target-ship/release/bundle/appimage/*.sig

  # 两个平台都成功才发布，只发布一次：updater 清单要同时带 windows-x86_64 与
  # linux-x86_64，谁先发都会让另一边的 url 短暂 404。
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist

      - name: 合并多平台更新清单
        run: |
          set -euo pipefail
          node tools/merge-latest-json.mjs \
            --out latest.json \
            --require windows-x86_64,linux-x86_64 \
            dist/release-windows/latest-windows.json \
            dist/release-linux/latest-linux.json

      # 移动 tag 后立即开跑时，GitHub 的 tag ref 可能尚未收敛，创建 release 会 500
      # 或退化成按默认分支建 untagged 草稿（资产传一半就成孤儿）。发布前先确认 tag 指向本次 commit。
      - name: 等待 tag 在 GitHub 侧收敛
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uri="https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          for i in $(seq 1 24); do
            actual="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$uri" | jq -r '.object.sha' || true)"
            if [[ "$actual" == "$EXPECTED_SHA" ]]; then
              echo "tag $TAG 已指向 $actual"
              exit 0
            fi
            echo "tag 当前指向 ${actual:-未就绪}，期望 $EXPECTED_SHA（第 $i 次）"
            sleep 5
          done
          echo "::error::等待 120s 后 tag $TAG 仍未收敛到 $EXPECTED_SHA，拒绝发布以免产生 untagged 草稿"
          exit 1

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: LiteLauncher ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            dist/release-windows/release/LiteLauncher.exe
            dist/release-windows/release/plugins.zip
            latest.json
            dist/release-windows/src-tauri/target-ship/release/bundle/nsis/*.exe
            dist/release-windows/src-tauri/target-ship/release/bundle/nsis/*.sig
            dist/release-linux/src-tauri/target-ship/release/bundle/deb/*.deb
            dist/release-linux/src-tauri/target-ship/release/bundle/appimage/*.AppImage
            dist/release-linux/src-tauri/target-ship/release/bundle/appimage/*.AppImage.tar.gz
            dist/release-linux/src-tauri/target-ship/release/bundle/appimage/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
